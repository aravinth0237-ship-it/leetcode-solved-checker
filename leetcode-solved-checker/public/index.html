<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>LeetCode Progress</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0f14;
  color:#f4f7fb;
}

.wrap{
  width:min(820px,100%);
  margin:auto;
  padding:18px 10px;
}

h1{
  text-align:center;
  font-size:26px;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#8e9aaa;
  font-size:12px;
  margin:0 0 16px;
}

.inputBox{
  background:#111821;
  border:1px solid #293646;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
}

textarea{
  width:100%;
  min-height:150px;
  resize:vertical;
  padding:11px;
  border-radius:9px;
  border:1px solid #303d4d;
  background:#0c1219;
  color:#fff;
  outline:none;
  font-size:12px;
  line-height:1.6;
  font-family:monospace;
}

textarea:focus{
  border-color:#7285a0;
}

textarea::placeholder{
  color:#657386;
}

button{
  width:100%;
  height:42px;
  margin-top:8px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#111;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  display:none;
  background:#2a171b;
  border:1px solid #5c292e;
  color:#ffb7bd;
  padding:9px;
  border-radius:9px;
  margin-bottom:10px;
  font-size:12px;
}

.board{
  background:#111821;
  border:1px solid #253140;
  border-radius:12px;
  overflow:hidden;
}

.header,
.member{

  display:grid;

  grid-template-columns:
  34px
  minmax(0,1fr)
  130px
  75px
  75px;

  align-items:center;

  gap:7px;
}

.header{

  padding:8px 9px;

  background:#151e29;

  color:#8997aa;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:.4px;
}

.member{

  min-height:44px;

  padding:5px 9px;

  border-top:
  1px solid #202a36;
}

.num{
  color:#738198;
  font-size:11px;
  text-align:center;
}

.name{

  font-size:12px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.count{

  text-align:right;

  font-size:17px;

  font-weight:800;
}

.past{

  text-align:right;

  font-size:17px;

  font-weight:800;

  color:#dfe7f2;
}

.status{

  color:#738198;

  font-size:9px;

  margin-top:1px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

@media(max-width:600px){

  .wrap{
    padding:10px 6px;
  }

  h1{
    font-size:22px;
  }

  .sub{
    font-size:10px;
    margin-bottom:9px;
  }

  .inputBox{
    padding:7px;
  }

  textarea{
    min-height:120px;
    padding:8px;
    font-size:10px;
  }

  button{
    height:36px;
    font-size:12px;
  }

  .header,
  .member{

    grid-template-columns:
    25px
    minmax(0,1fr)
    75px
    55px
    55px;

    gap:4px;
  }

  .header{
    padding:6px;
    font-size:7px;
  }

  .member{
    min-height:38px;
    padding:4px 6px;
  }

  .num{
    font-size:9px;
  }

  .name{
    font-size:10px;
  }

  .count,
  .past{
    font-size:13px;
  }

  .status{
    font-size:7px;
  }

}

</style>

</head>

<body>

<main class="wrap">

<h1>🏆 LeetCode Progress</h1>

<p class="sub">
Paste all LeetCode profile links — one link per line
</p>

<div class="inputBox">

<textarea
  id="profileLinks"
  placeholder="Paste LeetCode profile links here...

Example:
https://leetcode.com/u/user1/
https://leetcode.com/u/user2/
https://leetcode.com/u/user3/
https://leetcode.com/u/user4/"
></textarea>

<button id="checkAll">
Check Profiles
</button>

</div>

<div
  class="error"
  id="error"
></div>

<section class="board">

<div class="header">

  <div>#</div>

  <div>Member</div>

  <div>Status</div>

  <div>Solved</div>

  <div>Past 24h</div>

</div>

<div id="members"></div>

</section>

</main>


<script>

const profileLinks =
  document.getElementById(
    "profileLinks"
  );

const checkAllButton =
  document.getElementById(
    "checkAll"
  );

const members =
  document.getElementById(
    "members"
  );

const errorBox =
  document.getElementById(
    "error"
  );


/* CREATE ROWS */

function createRows(total){

  members.innerHTML = "";

  for(
    let i = 0;
    i < total;
    i++
  ){

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "member";

    row.innerHTML = `

      <div class="num">
        ${String(
          i + 1
        ).padStart(2,"0")}
      </div>

      <div>

        <div
          class="name"
          id="name-${i}"
        >
          Loading...
        </div>

        <div
          class="status"
          id="status-${i}"
        >
          Waiting
        </div>

      </div>

      <div
        class="status"
        id="profile-${i}"
      >
        —
      </div>

      <div
        class="count"
        id="count-${i}"
      >
        —
      </div>

      <div
        class="past"
        id="past-${i}"
      >
        —
      </div>

    `;

    members.appendChild(row);

  }

}


/* GET USERNAME */

function getUsername(value){

  value =
    value.trim();

  if(!value)
    return "";

  try{

    if(
      value.includes(
        "leetcode.com"
      )
    ){

      const url =
        new URL(
          value.startsWith("http")
            ? value
            : "https://" + value
        );

      const parts =
        url.pathname
        .split("/")
        .filter(Boolean);

      const uIndex =
        parts.indexOf("u");

      if(
        uIndex !== -1 &&
        parts[uIndex + 1]
      ){

        return decodeURIComponent(
          parts[uIndex + 1]
        );

      }

      return parts[0] || "";

    }

  }catch(error){

    return "";

  }

  return value
    .replace(/^@/,"")
    .replace(/\s/g,"");

}


/* CHECK ONE PROFILE */

async function checkProfile(
  index,
  link
){

  const name =
    document.getElementById(
      `name-${index}`
    );

  const count =
    document.getElementById(
      `count-${index}`
    );

  const past =
    document.getElementById(
      `past-${index}`
    );

  const status =
    document.getElementById(
      `status-${index}`
    );

  const profile =
    document.getElementById(
      `profile-${index}`
    );

  const username =
    getUsername(link);

  if(!username){

    name.textContent =
      "Invalid profile";

    count.textContent =
      "—";

    past.textContent =
      "—";

    status.textContent =
      "Invalid link";

    return;

  }

  name.textContent =
    "Loading...";

  count.textContent =
    "…";

  past.textContent =
    "…";

  status.textContent =
    "Checking";

  profile.textContent =
    `@${username}`;


  try{

    const response =
      await fetch(
        `/api/profile?username=${
          encodeURIComponent(
            username
          )
        }`
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Unable to load profile"
      );

    }

    name.textContent =
      data.realName ||
      `@${data.username}`;

    count.textContent =
      Number(
        data.solved?.total ?? 0
      ).toLocaleString();

    past.textContent =
      Number(
        data.past24Hours ?? 0
      ).toLocaleString();

    status.textContent =
      "Updated";

    profile.textContent =
      `@${data.username}`;

  }
  catch(error){

    name.textContent =
      "Error";

    count.textContent =
      "—";

    past.textContent =
      "—";

    status.textContent =
      "Try again";

  }

}


/* CHECK ALL */

checkAllButton.addEventListener(
  "click",
  async () => {

    errorBox.style.display =
      "none";

    const links =
      profileLinks.value
      .split(/\r?\n/)
      .map(
        link => link.trim()
      )
      .filter(Boolean);

    if(
      links.length === 0
    ){

      errorBox.textContent =
        "Please paste at least one LeetCode profile link.";

      errorBox.style.display =
        "block";

      return;

    }

    createRows(
      links.length
    );

    checkAllButton.disabled =
      true;

    checkAllButton.textContent =
      `Checking ${links.length} Profiles...`;


    await Promise.all(

      links.map(
        (link,index) =>
          checkProfile(
            index,
            link
          )
      )

    );


    checkAllButton.disabled =
      false;

    checkAllButton.textContent =
      "Check Profiles";

  }
);

</script>

</body>
</html>
