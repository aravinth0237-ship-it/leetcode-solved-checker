<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeetCode 14 Members</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:#0b0f14;
  color:#f4f7fb;
}

.wrap{
  width:min(760px,100%);
  margin:auto;
  padding:24px 12px;
}

h1{
  text-align:center;
  font-size:28px;
  margin:5px 0 4px;
}

.sub{
  text-align:center;
  color:#8e9aaa;
  font-size:13px;
  margin:0 0 18px;
}

.controls{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

button{
  flex:1;
  height:42px;
  border:0;
  border-radius:10px;
  background:white;
  color:#111;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.error{
  display:none;
  background:#2a171b;
  border:1px solid #5c292e;
  color:#ffb7bd;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:13px;
}

.board{
  background:#111821;
  border:1px solid #253140;
  border-radius:14px;
  overflow:hidden;
}

.header,
.member{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 150px 75px;
  align-items:center;
  gap:8px;
}

.header{
  padding:9px 10px;
  background:#151e29;
  color:#8997aa;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.member{
  min-height:47px;
  padding:6px 10px;
  border-top:1px solid #202a36;
}

.num{
  color:#738198;
  font-size:12px;
  text-align:center;
}

input{
  width:100%;
  height:34px;
  padding:0 9px;
  border-radius:7px;
  border:1px solid #303d4d;
  background:#0c1219;
  color:white;
  outline:none;
  font-size:12px;
}

input:focus{
  border-color:#7285a0;
}

.name{
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.count{
  text-align:right;
  font-size:18px;
  font-weight:800;
}

.status{
  color:#738198;
  font-size:10px;
  margin-top:2px;
}

@media(max-width:600px){
  .wrap{
    padding:12px 7px;
  }

  h1{
    font-size:23px;
  }

  .sub{
    font-size:11px;
    margin-bottom:10px;
  }

  .header,
  .member{
    grid-template-columns:25px minmax(0,1fr) 120px 58px;
    gap:5px;
  }

  .header{
    padding:7px 6px;
    font-size:9px;
  }

  .member{
    min-height:39px;
    padding:4px 6px;
  }

  input{
    height:29px;
    padding:0 6px;
    font-size:10px;
  }

  .name{
    font-size:11px;
  }

  .count{
    font-size:15px;
  }

  .status{
    font-size:8px;
  }

  button{
    height:38px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<main class="wrap">

<h1>🏆 LeetCode Progress</h1>
<p class="sub">14 Members • Total Problems Solved</p>

<div class="controls">
  <button id="checkAll">Check All 14 Profiles</button>
</div>

<div class="error" id="error"></div>

<section class="board">

  <div class="header">
    <div>#</div>
    <div>Profile Link</div>
    <div>Member</div>
    <div>Solved</div>
  </div>

  <div id="members"></div>

</section>

</main>

<script>

const members = document.getElementById("members");
const errorBox = document.getElementById("error");
const checkAllButton = document.getElementById("checkAll");

const savedLinks = Array(14).fill("");

function createMembers(){

  for(let i=0;i<14;i++){

    const row = document.createElement("div");
    row.className = "member";

    row.innerHTML = `
      <div class="num">${String(i+1).padStart(2,"0")}</div>

      <div>
        <input
          class="profileInput"
          data-index="${i}"
          placeholder="LeetCode profile link"
          value="${savedLinks[i]}"
        >
        <div class="status" id="status-${i}">Waiting</div>
      </div>

      <div class="name" id="name-${i}">—</div>

      <div class="count" id="count-${i}">—</div>
    `;

    members.appendChild(row);
  }
}

createMembers();


function getUsername(value){

  value = value.trim();

  if(!value) return "";

  try{

    if(value.includes("leetcode.com")){

      const url = new URL(
        value.startsWith("http")
          ? value
          : "https://" + value
      );

      const parts = url.pathname
        .split("/")
        .filter(Boolean);

      const uIndex = parts.indexOf("u");

      if(uIndex !== -1 && parts[uIndex + 1]){
        return parts[uIndex + 1];
      }

      return parts[0] || "";
    }

  }catch(e){}

  return value
    .replace(/^@/,"")
    .replace(/\s/g,"");
}


async function checkProfile(index){

  const input = document.querySelector(
    `.profileInput[data-index="${index}"]`
  );

  const name = document.getElementById(`name-${index}`);
  const count = document.getElementById(`count-${index}`);
  const status = document.getElementById(`status-${index}`);

  const username = getUsername(input.value);

  if(!username){

    name.textContent = "No profile";
    count.textContent = "—";
    status.textContent = "Enter link";
    return;
  }

  status.textContent = "Checking...";
  name.textContent = "Loading...";
  count.textContent = "…";

  try{

    const response = await fetch(
      `/api/profile?username=${encodeURIComponent(username)}`
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Unable to load profile");
    }

    name.textContent =
      data.realName || `@${data.username}`;

    count.textContent =
      Number(data.solved.total).toLocaleString();

    status.textContent =
      `@${data.username}`;

  }catch(error){

    name.textContent = "Error";
    count.textContent = "—";
    status.textContent = "Try again";
  }
}


checkAllButton.addEventListener("click", async () => {

  errorBox.style.display = "none";

  checkAllButton.disabled = true;
  checkAllButton.textContent = "Checking...";

  const inputs = document.querySelectorAll(".profileInput");

  inputs.forEach((input,index)=>{
    savedLinks[index] = input.value;
  });

  await Promise.all(
    Array.from({length:14},(_,index)=>
      checkProfile(index)
    )
  );

  checkAllButton.disabled = false;
  checkAllButton.textContent = "Check All 14 Profiles";

});


document.querySelectorAll(".profileInput").forEach(input => {

  input.addEventListener("change", () => {

    const index = Number(input.dataset.index);

    savedLinks[index] = input.value;

  });

});

</script>

</body>
</html>
