<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LeetCode Progress</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0f14;
  color:#f4f7fb;
}

.wrap{
  width:min(650px,100%);
  margin:auto;
  padding:18px 10px;
}

h1{
  text-align:center;
  font-size:26px;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#8e9aaa;
  font-size:12px;
  margin:0 0 16px;
}

.inputBox{
  background:#111821;
  border:1px solid #293646;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
}

textarea{
  width:100%;
  min-height:140px;
  resize:vertical;
  padding:11px;
  border-radius:9px;
  border:1px solid #303d4d;
  background:#0c1219;
  color:#fff;
  outline:none;
  font-size:12px;
  line-height:1.6;
  font-family:monospace;
}

textarea:focus{
  border-color:#7285a0;
}

textarea::placeholder{
  color:#657386;
}

button{
  width:100%;
  height:42px;
  margin-top:8px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#111;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  display:none;
  background:#2a171b;
  border:1px solid #5c292e;
  color:#ffb7bd;
  padding:9px;
  border-radius:9px;
  margin-bottom:10px;
  font-size:12px;
}

/* TABLE */

.board{
  background:#111821;
  border:1px solid #253140;
  border-radius:12px;
  overflow:hidden;
}

.header,
.member{
  display:grid;
  grid-template-columns:70px minmax(0,1fr) 90px;
  align-items:center;
}

.header{
  padding:10px 14px;
  background:#151e29;
  color:#8997aa;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.member{
  min-height:43px;
  padding:7px 14px;
  border-top:1px solid #202a36;
}

.num{
  color:#738198;
  font-size:12px;
}

.name{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.count{
  text-align:right;
  font-size:17px;
  font-weight:800;
}

@media(max-width:600px){

  .wrap{
    padding:10px 6px;
  }

  h1{
    font-size:22px;
  }

  .sub{
    font-size:10px;
    margin-bottom:9px;
  }

  .inputBox{
    padding:7px;
  }

  textarea{
    min-height:115px;
    font-size:10px;
  }

  button{
    height:36px;
    font-size:12px;
  }

  .header,
  .member{
    grid-template-columns:45px minmax(0,1fr) 65px;
  }

  .header{
    padding:7px 9px;
    font-size:9px;
  }

  .member{
    min-height:37px;
    padding:5px 9px;
  }

  .num{
    font-size:10px;
  }

  .name{
    font-size:11px;
  }

  .count{
    font-size:14px;
  }
}
</style>
</head>

<body>

<main class="wrap">

<h1>🏆 LeetCode Progress</h1>

<p class="sub">
Paste LeetCode profile links — one link per line
</p>

<div class="inputBox">

<textarea
  id="profileLinks"
  placeholder="Paste profile links here...

https://leetcode.com/u/user1/
https://leetcode.com/u/user2/
https://leetcode.com/u/user3/"
></textarea>

<button id="checkAll">
  Check Profiles
</button>

</div>

<div class="error" id="error"></div>

<section class="board">

  <div class="header">
    <div>NO.</div>
    <div>NAME</div>
    <div>SOLVED</div>
  </div>

  <div id="members"></div>

</section>

</main>


<script>

const profileLinks =
  document.getElementById("profileLinks");

const checkAllButton =
  document.getElementById("checkAll");

const members =
  document.getElementById("members");

const errorBox =
  document.getElementById("error");


/* GET USERNAME FROM PROFILE LINK */

function getUsername(value){

  value = value.trim();

  if(!value) return "";

  try{

    if(value.includes("leetcode.com")){

      const url = new URL(
        value.startsWith("http")
          ? value
          : "https://" + value
      );

      const parts =
        url.pathname
        .split("/")
        .filter(Boolean);

      const uIndex =
        parts.indexOf("u");

      if(
        uIndex !== -1 &&
        parts[uIndex + 1]
      ){
        return decodeURIComponent(
          parts[uIndex + 1]
        );
      }

      return parts[0] || "";
    }

  }catch(error){

    return "";

  }

  return value
    .replace(/^@/,"")
    .replace(/\s/g,"");
}


/*
  Remove symbols / numbers from the
  beginning for alphabetical sorting.

  Example:

  @Arun   -> Arun
  #Bala   -> Bala
  ★Chitra -> Chitra
  123David -> David
*/

function sortName(name){

  return String(name || "")
    .normalize("NFKD")
    .replace(/^[^A-Za-z]+/, "")
    .trim()
    .toLowerCase();
}


/* CREATE RESULT ROW */

function createRow(index, data){

  const row =
    document.createElement("div");

  row.className = "member";

  row.innerHTML = `

    <div class="num">
      ${String(index + 1).padStart(2,"0")}
    </div>

    <div class="name">
      ${escapeHTML(
        data.name || "Unknown"
      )}
    </div>

    <div class="count">
      ${Number(
        data.solved || 0
      ).toLocaleString()}
    </div>

  `;

  members.appendChild(row);
}


/* SAFE TEXT */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* CHECK ONE PROFILE */

async function getProfile(link){

  const username =
    getUsername(link);

  if(!username){

    return {
      name:"Invalid profile",
      solved:0
    };

  }

  try{

    const response =
      await fetch(
        `/api/profile?username=${encodeURIComponent(username)}`
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Unable to load profile"
      );

    }

    return {

      name:
        data.realName ||
        data.username ||
        username,

      solved:
        Number(
          data.solved?.total ?? 0
        )

    };

  }catch(error){

    return {

      name:
        dataSafeName(username),

      solved:0

    };

  }
}


/* FALLBACK NAME */

function dataSafeName(username){

  return username || "Unknown";

}


/* CHECK ALL */

checkAllButton.addEventListener(
  "click",
  async () => {

    errorBox.style.display = "none";

    const links =
      profileLinks.value
      .split(/\r?\n/)
      .map(link => link.trim())
      .filter(Boolean);


    if(links.length === 0){

      errorBox.textContent =
        "Please paste at least one LeetCode profile link.";

      errorBox.style.display = "block";

      return;
    }


    members.innerHTML = "";

    checkAllButton.disabled = true;

    checkAllButton.textContent =
      `Checking ${links.length} Profiles...`;


    /*
      Get all profiles
    */

    const results =
      await Promise.all(
        links.map(link =>
          getProfile(link)
        )
      );


    /*
      SORT A → Z

      Symbols at the beginning
      are ignored while sorting.
    */

    results.sort((a,b) => {

      const nameA =
        sortName(a.name);

      const nameB =
        sortName(b.name);

      return nameA.localeCompare(
        nameB,
        undefined,
        {
          sensitivity:"base"
        }
      );

    });


    /*
      DISPLAY SORTED RESULTS
    */

    results.forEach(
      (data,index) => {

        createRow(
          index,
          data
        );

      }
    );


    checkAllButton.disabled = false;

    checkAllButton.textContent =
      "Check Profiles";

  }
);

</script>

</body>
</html>
